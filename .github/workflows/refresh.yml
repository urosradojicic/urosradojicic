name: Refresh contribution graph

# The portrait, info card and shipped manifest are static — they change only
# when the photo or data/profile.json changes, and are regenerated by hand.
# Only the heatmap needs to keep up with reality, so only the heatmap runs here.

"on":
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily, off the hour to dodge the rush
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/fetch_contributions.py"
      - "scripts/render_heatmap.py"
      - "scripts/theme.py"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write          # the job commits the regenerated SVG back

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-daily.txt

      # Two packages, not the portrait toolchain. Installing rembg here would
      # pull ~250 MB of ONNX runtime every morning to scrape one HTML table.
      - run: pip install -r scripts/requirements-daily.txt

      - run: python scripts/fetch_contributions.py
      - run: python scripts/render_heatmap.py

      # Fails the run if the scrape produced something structurally wrong,
      # rather than committing a broken graph to the profile.
      - run: python scripts/verify.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
