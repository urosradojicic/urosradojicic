name: Refresh profile

# Rebuilds everything the runner can rebuild: the heatmap from GitHub's public
# calendar, and the info card and shipped manifest from data/profile.json.
#
# The portrait is the one exception. It needs the source photograph, which is
# deliberately not in this repository, and a ~250 MB toolchain. It is generated
# locally and committed. scripts/build.py skips it unless given --all, which is
# why this workflow can simply call build.py.

"on":
  schedule:
    # Every six hours at :17 — 00:17, 06:17, 12:17, 18:17 UTC, which is
    # 02:17 / 08:17 / 14:17 / 20:17 in Belgrade. Off the hour, where scheduled
    # runs queue up worst.
    #
    # Four a day is plenty: the graph's resolution is one day, so today's
    # square lights up on the first commit and later ones only deepen the shade
    # when they cross a bucket threshold.
    - cron: "17 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "data/profile.json"     # edit the card or manifest, even from the web UI
      - "scripts/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write          # the job commits the regenerated SVGs back

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-daily.txt

      # Two packages, not the portrait toolchain. Installing rembg here would
      # pull ~250 MB of ONNX runtime every hour to scrape one HTML table.
      - run: pip install -r scripts/requirements-daily.txt

      # Scrape, redraw the heatmap, rebuild the card and manifest, then verify.
      # build.py exits non-zero if verify.py fails, so a structurally broken
      # result fails the run instead of being committed to the profile.
      - run: python scripts/build.py

      # Commits as github-actions[bot], a separate identity — these commits do
      # not appear on the contribution graph, so refreshing hourly cannot
      # manufacture activity. The graph only ever reflects real work.
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile [skip ci]"
          file_pattern: >-
            data/contributions.json contrib-heatmap.svg
            info-card.svg shipped.svg
